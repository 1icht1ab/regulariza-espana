<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Comunidad de apoyo mutuo para personas que presentaron la Regularización Extraordinaria 2026 en España. Sin NIE ni NUSS: solo casillas." />
    <title>RegularizaEspaña · Comunidad 2026</title>
    <script>
      // Aplica tema e idioma guardados antes de pintar (evita parpadeo)
      (function () {
        try {
          var t = localStorage.getItem('re-tema');
          if (t === 'oscuro' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
          var l = localStorage.getItem('re-idioma');
          if (l) { document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
